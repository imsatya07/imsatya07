[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishtrain"
version = "0.1.0"
description = "Agentic phishing analyzer + gamified trainer"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
phishtrain = "phishtrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phishtrain"]

[tool.hatch.build.targets.wheel.force-include]
"samples" = "phishtrain/samples"
