[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exposure-radar"
version = "0.1.0"
description = "Agentic CVE-to-asset exposure correlator powered by Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
exposure-radar = "exposure_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exposure_radar"]
